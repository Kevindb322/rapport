<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E96">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rapport">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Rapport Frigotec</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ===================== INÍCIO: lista de rapports ===================== -->
<section id="home" class="screen">
  <header class="appbar">
    <div class="title"><b data-t="appName">Rapport Frigotec</b><small data-t="appSub"></small></div>
    <div class="langs" data-langs></div>
  </header>
  <div class="content">
    <button id="bInstall" class="install" hidden></button>
    <div id="pendingBanner" class="banner" hidden></div>
    <div id="list" class="list"></div>
    <div id="emptyList" class="empty" hidden>
      <div class="emptyIcon" data-icon="file"></div>
      <p data-t="emptyTitle"></p>
      <small data-t="emptyHint"></small>
    </div>
    <button id="bImport" class="ghost wide" data-icon-before="folder"><span data-t="import"></span></button>
    <p class="foot" id="verInfo"></p>
  </div>
  <button id="bNew" class="fab"><span data-icon="plus"></span><span data-t="newReport"></span></button>
</section>

<!-- ===================== EDITOR ===================== -->
<section id="editor" class="screen" hidden>
  <header class="appbar">
    <button class="icon" id="bBack" data-icon="back" data-tl="back"></button>
    <div class="title"><b id="edTitle"></b><small id="edSub"></small></div>
    <div class="langs" data-langs></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="head"><span data-icon="user"></span><span data-t="tabHead"></span></button>
    <button data-tab="report"><span data-icon="note"></span><span data-t="tabReport"></span><i class="cnt" id="cntReport"></i></button>
    <button data-tab="times"><span data-icon="clock"></span><span data-t="tabTimes"></span><i class="cnt" id="cntTimes"></i></button>
    <button data-tab="material"><span data-icon="box"></span><span data-t="tabMaterial"></span><i class="cnt" id="cntMaterial"></i></button>
    <button data-tab="sign"><span data-icon="pen"></span><span data-t="tabSign"></span><i class="cnt ok" id="cntSign"></i></button>
  </nav>
  <div class="content" id="edContent">
    <div class="tab" id="tab-head"></div>
    <div class="tab" id="tab-report" hidden></div>
    <div class="tab" id="tab-times" hidden></div>
    <div class="tab" id="tab-material" hidden></div>
    <div class="tab" id="tab-sign" hidden></div>
  </div>
  <footer class="actions">
    <button id="bPreview" class="secondary"><span data-icon="eye"></span><span data-t="preview"></span></button>
    <button id="bSave" class="primary"><span data-icon="save"></span><span data-t="savePdf"></span></button>
  </footer>
</section>

<!-- ===================== VISUALIZAR ===================== -->
<section id="preview" class="screen" hidden>
  <header class="appbar">
    <button class="icon" id="bBackPrev" data-icon="back" data-tl="back"></button>
    <div class="title"><b data-t="preview"></b><small id="prevSub"></small></div>
  </header>
  <div class="content" id="prevPages"></div>
  <footer class="actions">
    <button id="bPrevEdit" class="secondary"><span data-icon="edit"></span><span data-t="edit"></span></button>
    <button id="bPrevSave" class="primary"><span data-icon="save"></span><span data-t="savePdf"></span></button>
  </footer>
</section>

<!-- folha de opções que sobe de baixo -->
<div id="scrim" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog"></div>

<!-- assinatura em tela cheia -->
<div id="pad" hidden>
  <div class="padTop">
    <button class="icon" id="padClose" data-icon="close"></button>
    <b id="padTitle"></b>
    <button class="txt" id="padClear" data-t="clear"></button>
  </div>
  <div class="padArea"><canvas id="padCanvas"></canvas><div class="padLine"></div><span class="padHint" data-t="padHint"></span></div>
  <div class="padBottom">
    <span class="rot" data-t="rotateHint"></span>
    <button class="primary" id="padOk"><span data-icon="check"></span><span data-t="confirmSig"></span></button>
  </div>
</div>

<div id="toast" role="status"></div>
<input type="file" id="fImport" accept=".pdf,.json,application/pdf,application/json" hidden>
<input type="file" id="fSig" accept="image/*" hidden>

<script src="pdf-lib.min.js"></script>
<script src="forms.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
